<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restablecer Contraseña - ConectaPro</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
</head>
<body style="background:var(--color-fondo); display: flex; flex-direction: column; min-height: 100vh;">
    <div id="placeholder-header"></div>
    
    <main class="contenedor" style="flex: 1; display: flex; justify-content: center; align-items: center; padding: 40px 0;">
        <div style="background: white; padding: 40px; border-radius: var(--radio-borde-lg); box-shadow: var(--sombra); max-width: 450px; width: 100%; text-align: center;">
            <div style="width: 60px; height: 60px; background: #e0e7ff; color: var(--color-primario); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; margin: 0 auto 20px auto;">
                <i class="fa-solid fa-key"></i>
            </div>
            <h2 style="font-family: var(--fuente-titulos); color: var(--color-secundario); margin-bottom: 10px;">Crear Nueva Contraseña</h2>
            <p style="color: var(--color-texto-secundario); margin-bottom: 25px; font-size: 14px;">Ingresa tu nueva contraseña a continuación. Asegúrate de que sea segura.</p>
            
            <form id="form-restablecer" style="text-align: left;">
                <div class="grupo-formulario">
                    <label for="nueva-password">Nueva Contraseña</label>
                    <input type="password" id="nueva-password" class="input-formulario" placeholder="Mínimo 6 caracteres" required minlength="6">
                </div>
                <div class="grupo-formulario">
                    <label for="confirmar-password">Confirmar Contraseña</label>
                    <input type="password" id="confirmar-password" class="input-formulario" placeholder="Repite la contraseña" required minlength="6">
                </div>
                <button type="submit" class="boton boton-primario boton-bloque" id="btn-cambiar-pass">Actualizar Contraseña</button>
            </form>

            <div id="mensaje-feedback" style="margin-top: 20px; font-size: 14px; padding: 15px; border-radius: 8px; display: none;"></div>
        </div>
    </main>

    <div id="placeholder-footer"></div>
    <div id="placeholder-modales"></div>
    
    <script>
        document.getElementById('form-restablecer').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn-cambiar-pass');
            const password = document.getElementById('nueva-password').value;
            const confirmar = document.getElementById('confirmar-password').value;
            const feedback = document.getElementById('mensaje-feedback');
            
            if (password !== confirmar) {
                feedback.style.display = 'block';
                feedback.style.background = '#fee2e2';
                feedback.style.color = '#b91c1c';
                feedback.textContent = 'Las contraseñas no coinciden.';
                return;
            }

            // Obtener el token de la URL
            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get('token');

            if (!token) {
                feedback.style.display = 'block';
                feedback.style.background = '#fee2e2';
                feedback.style.color = '#b91c1c';
                feedback.textContent = 'El enlace es inválido o falta el token de seguridad.';
                return;
            }

            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Actualizando...';
            btn.disabled = true;
            feedback.style.display = 'none';

            try {
                const res = await fetch('../backend/api/restablecer_password.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, password })
                });
                const data = await res.json();
                
                feedback.style.display = 'block';
                if (data.status === 'success') {
                    feedback.style.background = '#dcfce7';
                    feedback.style.color = '#166534';
                    feedback.innerHTML = `<strong>¡Contraseña actualizada!</strong><br><br>Serás redirigido para iniciar sesión en 3 segundos...`;
                    document.getElementById('form-restablecer').reset();
                    btn.style.display = 'none';
                    
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 3000);
                } else {
                    feedback.style.background = '#fee2e2';
                    feedback.style.color = '#b91c1c';
                    feedback.textContent = data.message;
                }
            } catch (error) {
                feedback.style.display = 'block';
                feedback.style.background = '#fee2e2';
                feedback.style.color = '#b91c1c';
                feedback.textContent = 'Error al conectar con el servidor.';
            } finally {
                if (btn.style.display !== 'none') {
                    btn.textContent = 'Actualizar Contraseña';
                    btn.disabled = false;
                }
            }
        });
    </script>
    <script src="js/layout.js?v=9"></script>
    <script src="js/modales.js?v=9"></script>
</body>
</html>
